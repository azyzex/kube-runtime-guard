# The protected workload: namespace "shop", one FastAPI pod behind a Service.
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders-api, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders-api } }
  template:
    metadata: { labels: { app: orders-api } }
    spec:
      containers:
        - name: api
          image: orders-api:0.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 2 }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: orders-api, namespace: shop }
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 8000 }]
